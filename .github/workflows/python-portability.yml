name: Python portability
on: [push, pull_request, workflow_dispatch]
jobs:
  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip check
      - run: python tools/check_environment.py --skip-ffmpeg
      - run: python -m pytest modules/04_laptop_alignment_export/tests/test_platform_portability.py modules/04_laptop_alignment_export/tests/test_run_layout_manifest_concurrency.py modules/04_laptop_alignment_export/tests/test_incremental_episode_pipeline.py
